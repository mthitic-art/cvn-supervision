<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVN — ระบบนิเทศการสอน Active Learning</title>
<style>
/* ══════ CONFIG ══════ */
:root {
  --g1:#1a3a18; --g2:#2d5a27; --g3:#4a7c44; --gold:#c9a84c;
  --bg:#f0f5f0; --card:#fff; --border:#e0e8e0; --txt:#1a2e1a; --sub:#6b7280;
  --r5:#15803d; --r4:#1d4ed8; --r3:#7c3aed; --r2:#c2410c; --r1:#dc2626;
  --fs-base:16px; --fs-sm:14px; --fs-xs:12px; --fs-lg:18px; --fs-xl:22px;
  --pad:16px; --radius:14px; --gap:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:var(--fs-base);line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--g2);text-decoration:none}

/* ══════ LAYOUT ══════ */
.header{background:linear-gradient(135deg,var(--g1),var(--g2),var(--g1));color:#fff;padding:var(--pad);position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.header-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
.header h1{font-size:var(--fs-xl);font-weight:700;letter-spacing:.5px}
.header p{font-size:var(--fs-xs);color:#c9d4c9;margin-top:2px}
.nav{display:flex;gap:4px;background:#0f260e;border-radius:12px;padding:4px;max-width:860px;margin:10px auto 0}
.nav button{flex:1;padding:12px 8px;border:none;border-radius:10px;font-size:var(--fs-sm);font-weight:700;cursor:pointer;background:transparent;color:#8aa88a;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;min-height:44px}
.nav button.active{background:var(--g2);color:#fff}
.body{max-width:860px;margin:0 auto;padding:var(--pad) var(--gap) 120px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;margin-bottom:var(--gap)}
.card-head{padding:14px var(--pad);background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:700;font-size:var(--fs-lg)}

/* ══════ FORM ELEMENTS ══════ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding:var(--pad)}
.grid2 .full{grid-column:1/-1}
label.f-label{font-size:var(--fs-xs);font-weight:700;color:#4a5e4a;display:block;margin-bottom:4px}
input.f-inp,select.f-inp,textarea.f-inp{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:var(--fs-base);outline:none;box-sizing:border-box;font-family:inherit;background:#fff;transition:border .2s;min-height:48px}
input.f-inp:focus,select.f-inp:focus,textarea.f-inp:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(45,90,39,.15)}
textarea.f-inp{min-height:100px;resize:vertical}

/* ══════ DOMAIN / INDICATOR ══════ */
.dom-head{display:flex;align-items:center;padding:var(--pad);cursor:pointer;gap:12px;transition:all .2s}
.dom-head.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.dom-head:not(.on){background:#f8faf8;color:var(--g1)}
.dom-score{text-align:right;min-width:56px}
.dom-score .num{font-size:20px;font-weight:800}
.dom-score .max{font-size:var(--fs-xs);opacity:.7}
.progress{height:8px;border-radius:4px;background:#e8efe8;overflow:hidden;margin:0 var(--pad) 6px}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}
.sub-head{display:flex;align-items:center;justify-content:space-between;padding:12px var(--pad);cursor:pointer;border-top:1px solid #e8efe8;transition:background .2s;min-height:52px}
.sub-head.on{background:#f0f7f0}
.ind-row{padding:14px var(--pad);border-top:1px solid #f5f8f5}
.ind-row.star{background:#fffbf0}
.ind-row.even{background:#fafcfa}
.ind-text{display:flex;gap:8px;margin-bottom:10px;font-size:var(--fs-base);color:#374151;line-height:1.6}
.rating{display:flex;gap:8px;padding-left:20px;align-items:center;flex-wrap:wrap}
.r-btn{min-width:52px;height:46px;border:2px solid #d4d4d8;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:#9ca3af;font-size:var(--fs-lg);font-weight:800;line-height:1;transition:all .15s;-webkit-tap-highlight-color:transparent}
.r-btn:hover{transform:scale(1.05)}
.r-btn:active{transform:scale(.95)}
.r-btn.sel{color:#fff}
.r-btn .r-lbl{font-size:9px;font-weight:600;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:var(--fs-xs);font-weight:700}

/* ══════ PHOTO ══════ */
.photo-bar{padding:10px var(--pad) 12px;border-top:1px solid #e8efe8;background:#f8faf8;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.photo-btn{padding:8px 16px;border:2px dashed #b0c4b0;border-radius:10px;background:#fff;color:var(--g2);font-size:var(--fs-sm);font-weight:700;cursor:pointer;min-height:44px}
.photo-thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:2px solid #d1e0d1}
.photo-rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#dc2626;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}

/* ══════ BUTTONS ══════ */
.btn{padding:16px;border:none;border-radius:var(--radius);font-size:var(--fs-base);font-weight:700;cursor:pointer;width:100%;transition:all .2s;font-family:inherit;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff}
.btn-primary:active{opacity:.8}
.btn-outline{background:#fff;border:2px solid var(--g2);color:var(--g2)}
.btn-danger{background:#fff;border:2px solid #dc2626;color:#dc2626}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:var(--gap);margin-bottom:var(--gap)}

/* ══════ FLOATING BUTTON ══════ */
.fab{position:fixed;bottom:20px;right:16px;background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;border:none;border-radius:16px;padding:14px 24px;font-size:var(--fs-base);font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(26,58,24,.4);z-index:50;display:flex;align-items:center;gap:8px;font-family:inherit;min-height:52px}

/* ══════ TOAST ══════ */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--g1);color:#fff;padding:12px 24px;border-radius:12px;font-size:var(--fs-sm);font-weight:600;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:opacity .3s;white-space:nowrap}
.toast.hide{opacity:0;pointer-events:none}

/* ══════ MODAL ══════ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:var(--pad)}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{padding:16px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:700;font-size:var(--fs-lg);display:flex;justify-content:space-between;align-items:center}

/* ══════ EXPORT / PRINT ══════ */
.export-doc{background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden;margin-bottom:var(--gap)}

/* Print Overlay (works on Desktop and iOS) */
#print-overlay{position:fixed;inset:0;background:#fff;z-index:9999;overflow-y:auto;padding:12px;font-family:'Sarabun','Noto Sans Thai',sans-serif;-webkit-overflow-scrolling:touch}
.print-controls{position:sticky;top:0;background:#fff;padding:8px 0 12px;display:flex;gap:10px;z-index:10;border-bottom:1px solid #e0e8e0;margin-bottom:12px}
.print-hint{background:#f0fdf4;border:2px solid #2d5a27;border-radius:10px;padding:12px;margin-bottom:16px;font-size:13px;color:#1a3a18;line-height:1.7}
.print-content{padding-bottom:40px}
.print-content img{max-width:120px !important;height:90px !important;object-fit:cover;border-radius:6px}

@media print {
  body > *:not(#print-overlay) { display:none !important }
  #print-overlay { position:static !important; padding:0 !important; overflow:visible !important }
  .print-controls, .print-hint { display:none !important }
  .print-content { padding:0 !important }
  body { background:#fff !important; padding:0 !important; margin:0 !important; font-size:12px !important; overflow:visible !important }
  .export-doc { box-shadow:none !important; border-radius:0 !important; margin:0 !important; border:none !important }
  .export-doc * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important }
  @page { size:A4; margin:10mm }
}

/* ══════ SPINNER ══════ */
.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════ STATUS BAR ══════ */
.status-bar{padding:10px var(--pad);background:#fff3cd;color:#856404;font-size:var(--fs-sm);text-align:center;display:none}
.status-bar.connected{background:#d4edda;color:#155724}
.status-bar.error{background:#f8d7da;color:#721c24}

/* ══════════════════════════════════════════════════
   RESPONSIVE — Tablet (iPad / Galaxy Tab)
   ══════════════════════════════════════════════════ */
@media (min-width:768px) {
  :root { --fs-base:18px; --fs-sm:15px; --fs-xs:13px; --fs-lg:20px; --fs-xl:26px; --pad:20px; --gap:16px }
  .header{padding:18px 24px}
  .header svg{width:52px;height:52px}
  .nav button{padding:14px 12px;font-size:16px}
  .r-btn{min-width:64px;height:54px;font-size:22px}
  .r-btn .r-lbl{font-size:11px}
  .btn{padding:18px;font-size:18px;min-height:56px}
  .fab{padding:16px 28px;font-size:18px;bottom:24px;right:24px}
  .photo-thumb{width:64px;height:64px}
  .photo-btn{font-size:16px !important;padding:10px 18px !important}
  .dom-score .num{font-size:26px}
  .dom-score .max{font-size:14px !important}
  .ind-row{padding:18px 24px}
  .rating{gap:10px;padding-left:24px}
  .grid2{gap:16px;padding:20px}
  .progress{height:10px;border-radius:5px;margin:0 20px 8px}
  .badge{font-size:14px !important;padding:5px 12px}
  input.f-inp,select.f-inp,textarea.f-inp{padding:14px 16px;font-size:18px;min-height:54px}
  label.f-label{font-size:15px !important}

  /* ── Override inline font-sizes in evaluation sections ── */
  .dom-head div div{font-size:17px !important}
  .dom-head div div:last-child{font-size:15px !important}
  .dom-head span[style*="font-size:11"]{font-size:14px !important}
  .sub-head div span{font-size:16px !important}
  .sub-head div span:first-child{font-size:17px !important}
  .ind-text{font-size:17px !important}
  .ind-text span{font-size:17px !important}
  .ind-text span:first-child{font-size:14px !important}

  /* ── Summary / Export / History section text ── */
  .card div[style*="font-size:13px"]{font-size:16px !important}
  .card div[style*="font-size:12px"]{font-size:15px !important}
  .card div[style*="font-size:11px"]{font-size:14px !important}
  .card div[style*="font-size:10px"]{font-size:13px !important}
  .card div[style*="font-size:14px"]{font-size:17px !important}
  .card span[style*="font-size:11px"]{font-size:14px !important}
  .card span[style*="font-size:10px"]{font-size:13px !important}
  .card span[style*="font-size:18px"]{font-size:22px !important}
  .export-doc div[style*="font-size:13px"]{font-size:15px !important}
  .export-doc div[style*="font-size:12px"]{font-size:14px !important}
  .export-doc span[style*="font-size:10"]{font-size:12px !important}
}

/* ══════════════════════════════════════════════════
   RESPONSIVE — Desktop / Large tablet
   ══════════════════════════════════════════════════ */
@media (min-width:1024px) {
  :root { --fs-base:19px; --fs-sm:16px; --fs-xs:14px; --fs-lg:22px; --fs-xl:30px; --pad:24px; --gap:18px }
  .body{max-width:960px}
  .header-inner{max-width:960px}
  .header svg{width:56px;height:56px}
  .nav{max-width:960px}
  .nav button{font-size:18px;padding:16px 14px}
  .r-btn{min-width:72px;height:58px;font-size:24px;border-radius:12px}
  .r-btn .r-lbl{font-size:12px}
  .dom-head{padding:20px 28px}
  .dom-score .num{font-size:28px}
  .sub-head{padding:16px 28px}
  .ind-row{padding:20px 28px}
  .progress{height:12px;border-radius:6px;margin:0 28px 10px}
  .badge{font-size:15px !important;padding:6px 14px}
  .photo-thumb{width:72px;height:72px}
  .toast{font-size:16px;padding:14px 28px}

  /* ── Override inline font-sizes even larger ── */
  .dom-head div div{font-size:19px !important}
  .dom-head div div:last-child{font-size:16px !important}
  .sub-head div span{font-size:17px !important}
  .sub-head div span:first-child{font-size:18px !important}
  .ind-text{font-size:18px !important}
  .ind-text span{font-size:18px !important}
  .ind-text span:first-child{font-size:15px !important}
  .card div[style*="font-size:13px"]{font-size:17px !important}
  .card div[style*="font-size:12px"]{font-size:16px !important}
  .card div[style*="font-size:11px"]{font-size:15px !important}
  .card div[style*="font-size:14px"]{font-size:18px !important}
  .card span[style*="font-size:11px"]{font-size:15px !important}
  .card span[style*="font-size:18px"]{font-size:24px !important}
}

/* ══════════════════════════════════════════════════
   RESPONSIVE — Small phone (iPhone SE, Galaxy S)
   ══════════════════════════════════════════════════ */
@media (max-width:380px) {
  :root { --fs-base:15px; --fs-sm:13px; --pad:12px; --gap:10px }
  .header h1{font-size:18px}
  .nav button{font-size:12px;padding:10px 4px}
  .grid2{grid-template-columns:1fr}
  .r-btn{min-width:46px;height:42px;font-size:16px}
  .rating{gap:5px;padding-left:10px}
  .fab{padding:10px 16px;font-size:14px;bottom:12px;right:10px}
}
.status-bar{padding:8px 16px;background:#fff3cd;color:#856404;font-size:12px;text-align:center;display:none}
.status-bar.connected{background:#d4edda;color:#155724}
.status-bar.error{background:#f8d7da;color:#721c24}
/* ══════ LANGUAGE TOGGLE ══════ */
.lang-btn{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit}
.lang-btn:hover{background:rgba(255,255,255,.25)}
</style>
</head>

<div class="header">
  <div class="header-inner">

const ALL_IND=EVAL.flatMap(d=>d.subs.flatMap(s=>s.inds));
const QLVL=[{mn:90,l:"ยอดเยี่ยม",c:"#15803d",bg:"#dcfce7",e:"🏆",k:"r5"},{mn:80,l:"ดีเลิศ",c:"#1d4ed8",bg:"#dbeafe",e:"🌟",k:"r4"},{mn:70,l:"ดี",c:"#7c3aed",bg:"#ede9fe",e:"👍",k:"r3"},{mn:60,l:"ปานกลาง",c:"#c2410c",bg:"#ffedd5",e:"📝",k:"r2"},{mn:0,l:"กำลังพัฒนา",c:"#dc2626",bg:"#fef2f2",e:"🌱",k:"r1"}];
const getQ=p=>QLVL.find(l=>p>=l.mn)||QLVL[4];
function QL(q){return L(q.k)} // translated quality label
const SC={5:"#15803d",4:"#1d4ed8",3:"#7c3aed",2:"#c2410c",1:"#dc2626"};
const SL_TH={5:"ยอดเยี่ยม",4:"ดีเลิศ",3:"ดี",2:"ปานกลาง",1:"พัฒนา"};
const SL_EN={5:"Excellent",4:"V.Good",3:"Good",4:"V.Good",2:"Fair",1:"Improve"};
function SL(v){return state.lang==="en"?SL_EN[v]:SL_TH[v]}

// ══════ STATE ══════
let state = {
  view: "form",
  scores: {},
  info: {teacher:"",position:"",subject:"",subjectCode:"",level:"",room:"",students:"",date:"",period:"",topic:"",supervisor:"",visitNum:"",semester:"",year:""},
  fb: {strengths:"",growth:""},
  photos: {}, // {domainId: [{name, data}]}
  expDom: {1:true},
  expSub: {},
  records: [],
  saving: false,
  uploadTarget: null,
  histDetail: null,
  lang: "th",
  saved: false,
  historyUnlocked: false
};

// ══════ CALC ══════
function calcDom(dId,sc){
  const d=EVAL.find(x=>x.id===dId);
  const ids=d.subs.flatMap(s=>s.inds.map(i=>i.id));
  const raw=ids.reduce((a,id)=>a+(sc[id]||0),0);
  const mx=ids.length*5;
  const scored=ids.filter(id=>sc[id]).length;
  return{raw,mx,scored,total:ids.length,wt:mx>0?(raw/mx)*d.w:0,w:d.w};
}
function calcAll(sc){return EVAL.reduce((a,d)=>a+calcDom(d.id,sc).wt,0)}
function scoredCount(){return Object.keys(state.scores).length}

// ══════ TOAST ══════
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.remove("hide");
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.add("hide"),2500);
}

// ══════ RENDER ══════
function render(){
  const app=document.getElementById("app");
  if(state.view==="form") app.innerHTML=renderForm();
  else if(state.view==="summary") app.innerHTML=renderSummary();
  else if(state.view==="export") app.innerHTML=renderExport();
  else if(state.view==="history") app.innerHTML=renderHistory();
  updateNav();updateFab();bindEvents();
}

function switchView(v){
  state.view=v;
  if(v!=="history")state.histDetail=null;
  render();window.scrollTo(0,0);
}
function updateNav(){
  const btns=document.querySelectorAll(".nav button");
  const views=["form","summary","history"];
  const labels=[L("navForm"),L("navSummary"),L("navHistory")+"("+state.records.length+")"];
  btns.forEach((b,i)=>{b.classList.toggle("active",state.view===views[i]||(state.view==="export"&&i===1));b.textContent=labels[i]});
}
function updateFab(){
  const fab=document.getElementById("fab");
  const n=scoredCount();
  if(state.view==="form"&&n>0){
    const tw=calcAll(state.scores);const q=getQ(tw);
    fab.style.display="flex";fab.innerHTML=`${q.e} ${tw.toFixed(1)}/100 → ${L("navSummary").replace("📊 ","")}`;
  }else{fab.style.display="none"}
}

// ══════ FORM VIEW ══════
function renderForm(){
  const info=state.info;
  const sl=state.lang;
  let h=`<div class="card"><div class="card-head">${L("generalInfo")}</div><div class="grid2">`;

  // Teacher name (text input)
  h+=`<div><label class="f-label">${L("teacher")}</label><input class="f-inp" data-info="teacher" value="${esc(info.teacher)}" placeholder="${L("teacher").replace(' *','')}"></div>`;

  // Position (dropdown)
  h+=`<div><label class="f-label">${L("position")}</label><select class="f-inp" data-info="position"><option value="">${sl==="en"?"— Select —":"— เลือก —"}</option>`;
  POSITIONS.forEach(p=>{const v=p.th;const label=sl==="en"?p.en:p.th;h+=`<option value="${v}" ${info.position===v?"selected":""}>${label}</option>`;});
  h+=`</select></div>`;

  // Subject code (text input)
  h+=`<div><label class="f-label">${L("subjectCode")}</label><input class="f-inp" data-info="subjectCode" value="${esc(info.subjectCode)}"></div>`;

  // Subject (dropdown)
  h+=`<div><label class="f-label">${L("subject")}</label><select class="f-inp" data-info="subject"><option value="">${sl==="en"?"— Select —":"— เลือก —"}</option>`;
  SUBJECTS.forEach(p=>{const v=p.th;const label=sl==="en"?p.en:p.th;h+=`<option value="${v}" ${info.subject===v?"selected":""}>${label}</option>`;});
  h+=`</select></div>`;

  // Level (dropdown)
  h+=`<div><label class="f-label">${L("level")}</label><select class="f-inp" data-info="level"><option value="">${sl==="en"?"— Select —":"— เลือก —"}</option>`;
  LEVELS.forEach(p=>{const v=p.th;const label=sl==="en"?p.en:p.th;h+=`<option value="${v}" ${info.level===v?"selected":""}>${label}</option>`;});
  h+=`</select></div>`;

  // Room (dropdown) + Students (text)
  h+=`<div style="display:flex;gap:10px"><div style="flex:1"><label class="f-label">${sl==="en"?"Room":"ห้อง"}</label><select class="f-inp" data-info="room"><option value="">${sl==="en"?"—":"—"}</option>${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${info.room==n?"selected":""}>${n}</option>`).join("")}</select></div><div style="flex:1"><label class="f-label">${L("students")}</label><input class="f-inp" data-info="students" value="${esc(info.students)}"></div></div>`;

  // Date + Period
  // Parse existing date value (YYYY-MM-DD)
  const dateParts = (info.date||"").split("-");
  const dateY = dateParts[0]||"", dateM = dateParts[1]||"", dateD = dateParts[2]||"";
  const MONTHS_TH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  const MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const MONTHS = state.lang==="en" ? MONTHS_EN : MONTHS_TH;
  const dayOpts = Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${String(d).padStart(2,'0')}" ${dateD===String(d).padStart(2,'0')?"selected":""}>${d}</option>`).join("");
  const monOpts = MONTHS.map((m,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${dateM===v?"selected":""}>${m}</option>`;}).join("");
  const curY = new Date().getFullYear(); const startY = state.lang==="en" ? curY : curY+543;
  const yearOpts = Array.from({length:5},(_,i)=>startY-i).map(y=>`<option value="${state.lang==="en"?y:y-543}" ${dateY===(state.lang==="en"?String(y):String(y-543))?"selected":""}>${y}</option>`).join("");
  h+=`<div><label class="f-label">${L("date")}</label>
    <div style="display:flex;gap:6px">
      <select class="f-inp" id="date-d" style="flex:1" onchange="updateDate()">${`<option value="">${state.lang==="en"?"Day":"วัน"}</option>`+dayOpts}</select>
      <select class="f-inp" id="date-m" style="flex:2" onchange="updateDate()">${`<option value="">${state.lang==="en"?"Month":"เดือน"}</option>`+monOpts}</select>
      <select class="f-inp" id="date-y" style="flex:1.5" onchange="updateDate()">${`<option value="">${state.lang==="en"?"Year":"ปี"}</option>`+yearOpts}</select>
    </div>
  </div>`;
  h+=`<div><label class="f-label">${L("period")}</label><select class="f-inp" data-info="period"><option value="">${L("selectPeriod")}</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${info.period==n?"selected":""}>${L("periodN")} ${n}</option>`).join("")}</select></div>`;

  // Topic (full width)
  h+=`<div class="full"><label class="f-label">${L("topic")}</label><input class="f-inp" data-info="topic" value="${esc(info.topic)}" placeholder="${L("topic")}"></div>`;

  // Supervisor + Visit
  h+=`<div><label class="f-label">${L("supervisor")}</label><input class="f-inp" data-info="supervisor" value="${esc(info.supervisor)}"></div>`;
  h+=`<div><label class="f-label">${L("visitNum")}</label><select class="f-inp" data-info="visitNum"><option value="">${L("selectVisit")}</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${info.visitNum==n?"selected":""}>${L("visitN")} ${n}</option>`).join("")}</select></div>`;

  // Semester + Year
  h+=`<div><label class="f-label">${L("semester")}</label><select class="f-inp" data-info="semester"><option value="">—</option><option value="1" ${info.semester==="1"?"selected":""}>1</option><option value="2" ${info.semester==="2"?"selected":""}>2</option></select></div>`;
  h+=`<div><label class="f-label">${L("year")}</label><input class="f-inp" data-info="year" value="${esc(info.year)}" placeholder="2568"></div>`;
  h+=`</div></div>`;

  // Legend
  h+=`<div class="card" style="padding:10px 14px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#4a5e4a;align-items:center">
    <span>⬤ <b>${L("basic")}</b></span><span style="color:#c2410c">★ <b>${L("star")}</b></span>
    <span style="margin-left:auto;color:#9ca3af;font-size:11px">${L("scored")} ${scoredCount()}/${ALL_IND.length}</span></div>`;

  // Domains
  EVAL.forEach(d=>{
    const dc=calcDom(d.id,state.scores);
    const on=state.expDom[d.id];
    const dp=dc.w>0?(dc.wt/dc.w*100):0;
    const pc=dp>=80?"var(--r5)":dp>=60?"var(--r2)":"var(--r1)";
    h+=`<div class="card" style="border:2px solid ${on?"var(--g2)":"transparent"}">`;
    h+=`<div class="dom-head ${on?"on":""}" onclick="toggleDom(${d.id})"><span style="font-size:22px">${d.icon}</span><div style="flex:1"><div style="font-size:13px;font-weight:700">${L("domainN")} ${d.id} <span style="font-weight:400;font-size:11px;opacity:.8">(${L("weight")} ${d.w} ${L("points")})</span></div><div style="font-size:11.5px;opacity:.85;margin-top:1px">${TD(d)}</div></div><div class="dom-score"><div class="num">${dc.wt.toFixed(1)}</div><div class="max">/${d.w}</div></div><span style="font-size:14px;transition:transform .2s;transform:rotate(${on?180:0}deg)">▼</span></div>`;
    h+=`<div class="progress"><div class="progress-fill" style="width:${dp}%;background:${pc}"></div></div>`;
    h+=`<div style="display:flex;justify-content:space-between;font-size:10px;color:#6b7280;padding:0 16px 4px"><span>${L("raw")} ${dc.raw}/${dc.mx}</span><span>${dc.scored}/${dc.total} ${L("items")}</span></div>`;

    if(on){
      d.subs.forEach(s=>{
        const sOn=state.expSub[s.id];
        const sCnt=s.inds.filter(i=>state.scores[i.id]).length;
        const sRaw=s.inds.reduce((a,i)=>a+(state.scores[i.id]||0),0);
        const sMx=s.inds.length*5;
        h+=`<div class="sub-head ${sOn?"on":""}" onclick="toggleSub('${s.id}')"><div style="flex:1"><span style="font-size:12.5px;font-weight:700;color:var(--g1)">${s.id} </span><span style="font-size:12px;color:#4a5e4a">${TS(s)}</span></div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0"><span class="badge" style="background:${sCnt===s.inds.length?"#dcfce7":"#fef2f2"};color:${sCnt===s.inds.length?"#15803d":"#dc2626"}">${sCnt===s.inds.length?sRaw+"/"+sMx:sCnt+"/"+s.inds.length}</span><span style="font-size:11px;color:#9ca3af;transition:transform .2s;transform:rotate(${sOn?180:0}deg)">▼</span></div></div>`;

        if(sOn){
          s.inds.forEach((ind,idx)=>{
            const v=state.scores[ind.id];
            const cls=ind.y==="s"?"star":idx%2===0?"even":"";
            h+=`<div class="ind-row ${cls}"><div class="ind-text"><span style="flex-shrink:0;font-size:11px;margin-top:2px">${ind.y==="s"?'<span style="color:#c2410c">★</span>':'<span style="color:var(--g2)">⬤</span>'}</span><span>${TI(ind)}</span></div><div class="rating">`;
            [5,4,3,2,1].forEach(val=>{
              const sel=v===val;
              h+=`<div class="r-btn ${sel?"sel":""}" style="${sel?`border-color:${SC[val]};background:${SC[val]}`:""}" onclick="setScore('${ind.id}',${val})">${val}<span class="r-lbl">${SL(val)}</span></div>`;
            });
            if(v) h+=`<span style="margin-left:4px;font-size:11px;color:${SC[v]};font-weight:600">✓</span>`;
            h+=`</div></div>`;

        }

      const photos=state.photos[d.id]||[];

        h+=`<div style="position:relative"><img src="${p.data}" class="photo-thumb"><button class="photo-rm" onclick="removePhoto(${d.id},${i})">✕</button></div>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  });

  // Feedback
  h+=`<div class="card"><div class="card-head">${L("feedback")}</div><div style="padding:14px;display:flex;flex-direction:column;gap:14px">
    <div><label style="font-size:13px;font-weight:700;color:#15803d;margin-bottom:6px;display:block">${L("strengths")}</label><textarea class="f-inp" data-fb="strengths" placeholder="${L("strengthsP")}">${esc(state.fb.strengths)}</textarea></div>

  </div></div>`;
  return h;
}

  let h=`<div class="card" style="text-align:center;padding:28px 16px;background:linear-gradient(135deg,${q.bg},#fff)">
    <div style="font-size:44px">${q.e}</div>

    <div style="font-size:13px;color:#6b7280">${L("score100")}</div>
    <div style="font-size:20px;font-weight:700;color:${q.c};margin-top:4px">${QL(q)}</div>
    ${state.info.teacher?`<div style="font-size:14px;color:#4a5e4a;margin-top:12px"><b>${esc(state.info.teacher)}</b> | ${L("supervisorLabel")}: <b>${esc(state.info.supervisor)}</b></div>`:""}
  </div>`;
  // Domain breakdown
  h+=`<div class="card"><div style="padding:12px 16px;border-bottom:1px solid #e8efe8;font-weight:700;font-size:15px;color:var(--g1)">${L("domainBreakdown")}</div>`;
  EVAL.forEach(d=>{
    const dc=calcDom(d.id,state.scores);const dp=dc.w>0?(dc.wt/dc.w*100):0;const dq=getQ(dp);
    h+=`<div style="padding:12px 16px;border-bottom:1px solid #f0f5f0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;font-weight:600">${d.icon} ${L("domainN")} ${d.id} <span style="font-weight:400;color:#9ca3af;font-size:11px">(${d.w})</span></span><div style="display:flex;align-items:center;gap:6px"><span style="font-size:15px;font-weight:800;color:${dq.c}">${dc.wt.toFixed(1)}/${d.w}</span><span class="badge" style="background:${dq.bg};color:${dq.c}">${QL(dq)}</span></div></div><div class="progress"><div class="progress-fill" style="width:${dp}%;background:${dq.c}"></div></div></div>`;
  });
  h+=`</div>`;
  // Feedback

// ══════ HISTORY VIEW ══════
// Helper: extract scores object from record (supports both nested + flat formats)
function recScores(r){
  if(r.scores && typeof r.scores==="object") return r.scores;
  const out={};
  // Flat format from Google Sheets: score_1.1.1, score_1.1.2, ...
  Object.keys(r).forEach(k=>{
    if(k.startsWith("score_")){
      const id=k.replace("score_","");
      const v=parseInt(r[k]);
      if(!isNaN(v)&&v>=1&&v<=5) out[id]=v;
    }
  });
  return out;
}
// Helper: extract feedback from record
function recFb(r){
  if(r.fb && typeof r.fb==="object") return r.fb;
  return {strengths:r.feedback_strengths||"",growth:r.feedback_growth||""};
}

// ══════ PIN PROTECTION ══════
function checkPin(){
  const input=document.getElementById("pin-input");
  const errBox=document.getElementById("pin-error");
  if(!input)return;
  const val=input.value.trim();
  if(val===HISTORY_PIN || val===MASTER_PIN){
    state.historyUnlocked=true;
    sessionStorage.setItem("cvn-history-unlocked","1"); // remember for this session
    if(SCRIPT_URL && state.records.length===0) loadRecords();
    render();
    toast(state.lang==="en"?"🔓 Unlocked":"🔓 ปลดล็อกสำเร็จ");
  }else{
    if(errBox) errBox.textContent=state.lang==="en"?"❌ Incorrect PIN. Please try again.":"❌ รหัส PIN ไม่ถูกต้อง กรุณาลองใหม่";
    input.value="";input.focus();
  }
}

function lockHistory(){
  state.historyUnlocked=false;
  state.histDetail=null;
  sessionStorage.removeItem("cvn-history-unlocked");
  switchView("form");
  toast(state.lang==="en"?"🔒 History locked":"🔒 ล็อกประวัติแล้ว");
}

function deleteRecord(id){
  if(!confirm(L("confirmDelete"))) return;
  state.records=state.records.filter(r=>r.id!==id);
  localStorage.setItem("cvn-local",JSON.stringify(state.records));
  state.histDetail=null;render();toast("ลบรายการเรียบร้อย");
}

function clearAllRecords(){
  if(!confirm(L("confirmClear"))) return;
  state.records=[];localStorage.removeItem("cvn-local");
  render();toast("ล้างประวัติเรียบร้อย");
}

function updateDate(){
  const d=document.getElementById("date-d")?.value||"";
  const m=document.getElementById("date-m")?.value||"";
  const y=document.getElementById("date-y")?.value||"";
  if(d&&m&&y) state.info.date=`${y}-${m}-${d}`;
  else state.info.date="";
  updateFab();
}

function setScore(id,val){
  // Validate: must be integer 1-5
  const v=parseInt(val);
  if(isNaN(v)||v<1||v>5){return;}
  state.scores[id]=v;
  render();
}
function toggleDom(id){state.expDom[id]=!state.expDom[id];render()}
function toggleSub(id){state.expSub[id]=!state.expSub[id];render()}
function uploadPhoto(did){state.uploadTarget=did;document.getElementById("file-input").click()}
function removePhoto(did,idx){state.photos[did].splice(idx,1);render()}

document.getElementById("file-input").addEventListener("change",function(e){
  const f=e.target.files?.[0];if(!f||!state.uploadTarget)return;
  const r=new FileReader();
  r.onload=ev=>{
    if(!state.photos[state.uploadTarget])state.photos[state.uploadTarget]=[];
    state.photos[state.uploadTarget].push({name:f.name,data:ev.target.result});
    toast("อัปโหลดสำเร็จ");render();
  };
  r.readAsDataURL(f);e.target.value="";
});

  state.scores={};state.photos={};state.fb={strengths:"",growth:""};
  state.info={teacher:"",position:"",subject:"",subjectCode:"",level:"",room:"",students:"",date:"",period:"",topic:"",supervisor:"",visitNum:"",semester:"",year:""};
  state.expDom={1:true};state.expSub={};state.saved=false;switchView("form");toast(state.lang==="en"?"Form cleared":"ล้างฟอร์มเรียบร้อย");
}

// ══════ COPY ══════
function doCopy(){
  const sc=state.scores;const inf=state.info;const fb=state.fb;
  const tw=calcAll(sc);const q=getQ(tw);
  let t=`═══ ${L("exportTitle")} ═══\n${L("schoolName")}\n\n`;
  t+=`👤 ${L("teacher").replace(' *','')}:  ${inf.teacher||"-"}\n📌 ${L("position")}: ${dispPos(inf.position)}\n📚 ${L("subject")}: ${inf.subjectCode||""} ${dispSubj(inf.subject)||"-"}\n🎓 ${L("classLevel")}: ${dispLevel(inf.level)} ${inf.room?(state.lang==="en"?"Room ":"ห้อง ")+inf.room:""} | ${L("students")}: ${esc(inf.students||"-")} ${state.lang==="en"?"students":"คน"}\n📅 ${L("dateLabel")}: ${inf.date||"-"} | ${L("periodLabel")}: ${inf.period||"-"}\n📝 ${L("topicLabel")}: ${inf.topic||"-"}\n👨‍🏫 ${L("supervisorLabel")}: ${inf.supervisor||"-"} | ${L("visitLabel")}: ${inf.visitNum||"-"}\n📆 ${L("semesterLabel")} ${inf.semester||"-"} / ${esc(inf.year||"-")}\n\n`;
  t+=`══ ${L("score100")}: ${tw.toFixed(1)}/100 (${QL(q)}) ══\n\n`;
  EVAL.forEach(d=>{const dc=calcDom(d.id,sc);t+=`${d.icon} ${L("domainN")} ${d.id}: ${dc.wt.toFixed(1)}/${d.w} (${L("raw")} ${dc.raw}/${dc.mx})\n`;d.subs.forEach(s=>{t+=`  ${s.id} ${TS(s)}\n`;s.inds.forEach(i=>{t+=`    ${i.y==="s"?"★":"⬤"} ${TI(i)}: ${sc[i.id]||"-"}/5\n`;});});t+=`\n`;});
  if(fb.strengths)t+=`🌟 ${L("strengths").split("(")[0].replace("🌟 ","")}:\n${fb.strengths}\n\n`;
  if(fb.growth)t+=`🔧 ${L("growth").split("(")[0].replace("🔧 ","")}:\n${fb.growth}\n`;

  const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("คัดลอกสำเร็จ!");}catch(e){
    prompt("กรุณาคัดลอกข้อความด้านล่าง (Ctrl+A แล้ว Ctrl+C):",t);
  }
  document.body.removeChild(ta);
}

// ══════ PRINT / PDF ══════
function doPrint(){
  const el=document.getElementById("print-area");
  if(!el){toast("ไม่พบข้อมูลสรุป / Summary not found");return;}

  // Create a clean fullscreen overlay that contains ONLY the summary
  // This works for both desktop print and iOS Safari Share→Print
  let overlay=document.getElementById("print-overlay");
  if(overlay) overlay.remove();

  overlay=document.createElement("div");
  overlay.id="print-overlay";
  overlay.innerHTML=`
    <div class="print-controls">
      <button onclick="closePrintOverlay()" style="flex:1;padding:14px;background:#f3f4f6;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">✕ ปิด / Close</button>
      <button onclick="window.print()" style="flex:2;padding:14px;background:#2d5a27;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">🖨️ Print / Save PDF</button>
    </div>
    <div class="print-hint">
      <b>💡 ${state.lang==="en"?"How to Save as PDF":"วิธีบันทึกเป็น PDF"}:</b><br>
      <b>${state.lang==="en"?"Desktop":"คอม"}:</b> ${state.lang==="en"?"Click Print button → Select 'Save as PDF'":"กดปุ่ม Print → เลือก 'Save as PDF'"}<br>
      <b>iPhone:</b> ${state.lang==="en"?"Tap Share (□↑) at bottom → Print → Tap Share again → Save to Files":"กด Share (□↑) ด้านล่าง Safari → Print → กด Share อีกครั้ง → Save to Files"}<br>
      <b>Android:</b> ${state.lang==="en"?"Menu (⋮) → Share → Print → Save as PDF":"เมนู (⋮) → Share → Print → Save as PDF"}
    </div>
    <div class="print-content">${el.outerHTML}</div>
  `;
  document.body.appendChild(overlay);
  document.body.style.overflow="hidden";
  window.scrollTo(0,0);
}
function closePrintOverlay(){
  const o=document.getElementById("print-overlay");
  if(o) o.remove();
  document.body.style.overflow="";
}

// ══════ SAVE TO GOOGLE SHEETS ══════
// Check for duplicate records (same teacher + date + period in last 24h)
function checkDuplicate(){
  const now=new Date();
  const teacher=(state.info.teacher||"").trim().toLowerCase();
  const date=state.info.date||"";
  const period=state.info.period||"";
  const visitNum=state.info.visitNum||"";

  if(!teacher) return null;

  const dups=state.records.filter(r=>{
    const rTeacher=(r.teacher||"").trim().toLowerCase();
    if(rTeacher!==teacher) return false;
    if(date && r.date===date && period && String(r.period)===String(period)) return true;
    if(visitNum && String(r.visitNum)===String(visitNum) && date && r.date===date) return true;
    // Recent same teacher (within X hours)
    if(r.timestamp){
      const ts=new Date(r.timestamp);
      const hoursDiff=(now-ts)/(1000*60*60);
      if(hoursDiff<DUPLICATE_CHECK_HOURS && rTeacher===teacher && date===r.date) return true;
    }
    return false;
  });
  return dups.length>0 ? dups[0] : null;
}

async function saveToSheet(){
  if(!state.info.teacher||!state.info.supervisor){toast(L("teacher").includes("*")?"กรุณากรอกชื่อผู้รับการนิเทศและผู้นิเทศ":"Please fill in teacher and supervisor name");return}
  if(scoredCount()<10){toast("กรุณาประเมินอย่างน้อย 10 รายการ / Please score at least 10 items");return}

  // Check for duplicates
  const dup=checkDuplicate();
  if(dup){
    const dupDate=dup.timestamp?new Date(dup.timestamp).toLocaleString(state.lang==="en"?"en-US":"th-TH",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
    const msg=state.lang==="en"
      ? `⚠️ Possible duplicate found!\n\nTeacher: ${dup.teacher}\nDate: ${dup.date||"-"} | Period: ${dup.period||"-"} | Visit: ${dup.visitNum||"-"}\nSaved: ${dupDate}\n\nDo you still want to save a new record?`
      : `⚠️ พบรายการนิเทศที่อาจซ้ำ!\n\nครู: ${dup.teacher}\nวันที่: ${dup.date||"-"} | คาบ: ${dup.period||"-"} | ครั้งที่: ${dup.visitNum||"-"}\nบันทึกเมื่อ: ${dupDate}\n\nต้องการบันทึกรายการใหม่หรือไม่?`;
    if(!confirm(msg)){
      toast(state.lang==="en"?"Save cancelled":"ยกเลิกการบันทึก");
      return;
    }
  }

  if(!SCRIPT_URL){toast(L("noScript"));saveLocal();return}

  state.saving=true;render();
  const tw=calcAll(state.scores);const q=getQ(tw);

  // Don't send photos via form (too large) — photos save to Drive only when hosted
  const body={info:state.info,scores:state.scores,feedback:state.fb,photos:[],totalWeighted:tw.toFixed(1),quality:QL(q)};
  const jsonStr=JSON.stringify(body);

  // Method 1: Try fetch with no-cors (works on hosted sites)
  // Method 2: Fallback to hidden form+iframe (works from file://)
  let success=false;

  // Try fetch first
  try{
    const res=await fetch(SCRIPT_URL,{
      method:"POST",
      mode:"no-cors",
      redirect:"follow",
      headers:{"Content-Type":"text/plain"},
      body:jsonStr
    });
    // With no-cors, response is opaque — can't read it but data may be saved
    // Wait a moment then verify via GET
    await new Promise(r=>setTimeout(r,2000));
    try{
      const check=await fetch(SCRIPT_URL+"?action=list");
      const checkData=await check.json();
      if(checkData.success && checkData.records.length>0){
        success=true;
        state.records=checkData.records;
      }
    }catch(e){}
  }catch(e){}

  // If fetch didn't work, try form submission
  if(!success){
    try{
      await new Promise((resolve,reject)=>{
        const iframe=document.createElement("iframe");
        iframe.name="cvn_save_"+Date.now();
        iframe.style.cssText="position:fixed;left:-9999px;width:1px;height:1px";
        document.body.appendChild(iframe);

        const form=document.createElement("form");
        form.method="POST";
        form.action=SCRIPT_URL;
        form.target=iframe.name;

        const input=document.createElement("input");
        input.type="hidden";input.name="payload";input.value=jsonStr;
        form.appendChild(input);

        document.body.appendChild(form);

        iframe.onload=()=>{
          setTimeout(()=>{
            try{document.body.removeChild(iframe)}catch(e){}
            try{document.body.removeChild(form)}catch(e){}
            resolve();
          },1000);
        };
        iframe.onerror=()=>{ reject(new Error("form submit failed")); };

        form.submit();
        // Safety timeout
        setTimeout(resolve,5000);
      });
      success=true;
    }catch(e){}
  }

  if(success){
    toast("✅ "+L("save").replace("💾 ","")+"!");
    state.saved=true;
    saveLocal();
    loadRecords();
  }else{
    toast("⚠️ Saving locally — will sync when hosted on GitHub Pages");
    saveLocal();
  }
  state.saving=false;render();
}

function saveLocal(){
  const tw=calcAll(state.scores);const q=getQ(tw);
  const rec={
    id:Date.now(),timestamp:new Date().toISOString(),
    teacher:state.info.teacher, position:state.info.position,
    subjectCode:state.info.subjectCode, subject:state.info.subject,
    level:state.info.level, room:state.info.room, students:state.info.students,
    date:state.info.date, period:state.info.period, topic:state.info.topic,
    supervisor:state.info.supervisor, visitNum:state.info.visitNum,
    semester:state.info.semester, year:state.info.year,
    total_weighted:tw.toFixed(1), quality:q.l,
    scores:{...state.scores}, fb:{...state.fb}
  };
  let local=JSON.parse(localStorage.getItem("cvn-local")||"[]");
  local.unshift(rec);localStorage.setItem("cvn-local",JSON.stringify(local.slice(0,200)));
  state.records=local;
  state.saved=true;
  toast("💾 บันทึกสำเร็จ");render();
}

// ══════ LOAD RECORDS ══════
async function loadRecords(){
  if(!SCRIPT_URL){
    // Load from localStorage
    const local=JSON.parse(localStorage.getItem("cvn-local")||"[]");
    state.records=local;render();
    return;
  }
  try{
    const res=await fetch(SCRIPT_URL+"?action=list");const data=await res.json();
    if(data.success){state.records=data.records;render();toast("โหลดข้อมูลสำเร็จ ("+data.records.length+" รายการ)");}
  }catch(e){toast("โหลดข้อมูลไม่สำเร็จ")}
}

// ══════ BIND EVENTS ══════
// HTML escape to prevent XSS and broken HTML from user input
function esc(s){
  if(s==null) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function bindEvents(){
  document.querySelectorAll("[data-info]").forEach(el=>{
    el.addEventListener("input",e=>{state.info[e.target.dataset.info]=e.target.value});
    el.addEventListener("change",e=>{state.info[e.target.dataset.info]=e.target.value});
  });
  document.querySelectorAll("[data-fb]").forEach(el=>{
    el.addEventListener("input",e=>{state.fb[e.target.dataset.fb]=e.target.value});
  });
  // PIN input: Enter key submits
  const pinInput=document.getElementById("pin-input");
  if(pinInput){
    pinInput.addEventListener("keydown",e=>{if(e.key==="Enter")checkPin();});
    pinInput.focus();
  }
}

// ══════ INIT ══════
function init(){
  // Restore unlock state for this session
  if(sessionStorage.getItem("cvn-history-unlocked")==="1"){
    state.historyUnlocked=true;
  }
  // Always load records first (local or remote)
  loadRecords();
  render();
  if(SCRIPT_URL){
    const bar=document.getElementById("status-bar");
    bar.style.display="block";bar.textContent="🔄 กำลังเชื่อมต่อ Google Sheets...";bar.className="status-bar";
    loadRecords().then(()=>{bar.textContent="✅ เชื่อมต่อ Google Sheets สำเร็จ";bar.className="status-bar connected";setTimeout(()=>{bar.style.display="none"},3000)}).catch(()=>{bar.textContent="❌ เชื่อมต่อไม่สำเร็จ";bar.className="status-bar error"});
  }
}
init();
