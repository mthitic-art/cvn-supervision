<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVN SITMAP — แบบนิเทศการสอนประถมศึกษา</title>
<style>
:root {
  --g1:#1a3a18; --g2:#2d5a27; --g3:#4a7c44; --gold:#c9a84c;
  --bg:#fef9f3; --card:#fff; --border:#e5d9c5; --txt:#2d2416; --sub:#6b7280;
  --S:#16a34a;  --S-bg:#dcfce7;   /* Student - Green */
  --I:#eab308;  --I-bg:#fef3c7;   /* Innovation - Yellow */
  --T:#2563eb;  --T-bg:#dbeafe;   /* Teacher - Blue */
  --M:#ea580c;  --M-bg:#ffedd5;   /* Material - Orange */
  --A:#9333ea;  --A-bg:#f3e8ff;   /* Atmosphere - Purple */
  --r5:#15803d; --r4:#1d4ed8; --r3:#7c3aed; --r2:#c2410c; --r1:#dc2626;
  --fs-base:16px; --fs-sm:14px; --fs-xs:12px; --fs-lg:18px; --fs-xl:22px;
  --pad:16px; --radius:18px; --gap:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:linear-gradient(135deg,#fef9f3,#f0f7f0);color:var(--txt);min-height:100vh;font-size:var(--fs-base);line-height:1.6;-webkit-text-size-adjust:100%}

/* ══════ HEADER ══════ */
.header{background:linear-gradient(135deg,var(--g1),var(--g2),var(--g1));color:#fff;padding:var(--pad);position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px}
.header h1{font-size:var(--fs-xl);font-weight:800;letter-spacing:.5px;line-height:1.2}
.header p{font-size:var(--fs-xs);color:#d4c98a;margin-top:2px;font-weight:600}
.nav{display:flex;gap:4px;background:#0f260e;border-radius:14px;padding:4px;max-width:900px;margin:10px auto 0}
.nav button{flex:1;padding:12px 8px;border:none;border-radius:11px;font-size:var(--fs-sm);font-weight:700;cursor:pointer;background:transparent;color:#8aa88a;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .25s;min-height:44px}
.nav button.active{background:var(--gold);color:#1a3a18;box-shadow:0 2px 8px rgba(201,168,76,.4)}
.lang-btn{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:inherit}
.lang-btn:hover{background:rgba(255,255,255,.25)}

.body{max-width:900px;margin:0 auto;padding:var(--pad) var(--gap) 120px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.06);overflow:hidden;margin-bottom:var(--gap)}
.card-head{padding:14px var(--pad);background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:700;font-size:var(--fs-lg);display:flex;align-items:center;gap:8px}

/* ══════ SITMAP HERO ══════ */
.sitmap-hero{padding:18px 16px;background:linear-gradient(135deg,#fff,#fef9f3);border-radius:var(--radius);margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.sitmap-letters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.sitmap-letter{padding:14px 6px;border-radius:14px;text-align:center;cursor:pointer;transition:transform .2s;border:3px solid transparent;position:relative}
.sitmap-letter:hover{transform:translateY(-3px)}
.sitmap-letter.active{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.sitmap-letter .big{font-size:34px;font-weight:900;line-height:1}
.sitmap-letter .name{font-size:10px;font-weight:700;margin-top:4px;opacity:.85}
.sitmap-letter .score{font-size:16px;font-weight:800;margin-top:3px}
.sitmap-letter[data-d="S"]{background:var(--S-bg);color:var(--S);border-color:var(--S-bg)}
.sitmap-letter[data-d="I"]{background:var(--I-bg);color:#a16207;border-color:var(--I-bg)}
.sitmap-letter[data-d="T"]{background:var(--T-bg);color:var(--T);border-color:var(--T-bg)}
.sitmap-letter[data-d="M"]{background:var(--M-bg);color:var(--M);border-color:var(--M-bg)}
.sitmap-letter[data-d="A"]{background:var(--A-bg);color:var(--A);border-color:var(--A-bg)}
.sitmap-letter[data-d="S"].active{border-color:var(--S)}
.sitmap-letter[data-d="I"].active{border-color:var(--I)}
.sitmap-letter[data-d="T"].active{border-color:var(--T)}
.sitmap-letter[data-d="M"].active{border-color:var(--M)}
.sitmap-letter[data-d="A"].active{border-color:var(--A)}
.sitmap-letter .check{position:absolute;top:6px;right:6px;font-size:14px}

/* ══════ FORM ELEMENTS ══════ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding:var(--pad)}
.grid2 .full{grid-column:1/-1}
label.f-label{font-size:var(--fs-xs);font-weight:700;color:#4a3e26;display:block;margin-bottom:4px}
input.f-inp,select.f-inp,textarea.f-inp{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:var(--fs-base);outline:none;box-sizing:border-box;font-family:inherit;background:#fff;transition:all .2s;min-height:48px}
input.f-inp:focus,select.f-inp:focus,textarea.f-inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.2)}
textarea.f-inp{min-height:100px;resize:vertical}

/* ══════ DOMAIN SECTION ══════ */
.dom-card{background:#fff;border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.dom-head{display:flex;align-items:center;padding:18px var(--pad);gap:14px;cursor:pointer;transition:all .2s;color:#fff}
.dom-head[data-d="S"]{background:linear-gradient(135deg,var(--S),#15803d)}
.dom-head[data-d="I"]{background:linear-gradient(135deg,var(--I),#ca8a04)}
.dom-head[data-d="T"]{background:linear-gradient(135deg,var(--T),#1d4ed8)}
.dom-head[data-d="M"]{background:linear-gradient(135deg,var(--M),#c2410c)}
.dom-head[data-d="A"]{background:linear-gradient(135deg,var(--A),#7c3aed)}
.dom-letter-big{font-size:48px;font-weight:900;line-height:1;width:60px;text-align:center;text-shadow:2px 2px 4px rgba(0,0,0,.2)}
.dom-info{flex:1}
.dom-name{font-size:17px;font-weight:800;line-height:1.2}
.dom-name-en{font-size:13px;font-weight:500;opacity:.9;margin-top:1px}
.dom-meta{font-size:11px;opacity:.85;margin-top:4px;font-weight:600}
.dom-score-big{text-align:right;flex-shrink:0}
.dom-score-big .num{font-size:30px;font-weight:900;line-height:1}
.dom-score-big .max{font-size:13px;opacity:.85;font-weight:600}

.progress{height:8px;background:#e8efe8;overflow:hidden;margin:0}
.progress-fill{height:100%;transition:width .4s ease}

.ind-row{padding:16px var(--pad);border-bottom:1px solid #f3f0e8;transition:background .2s}
.ind-row:last-child{border-bottom:none}
.ind-row.has-score{background:linear-gradient(to right,#fafff5,#fff)}
.ind-text{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.ind-num{font-size:14px;font-weight:800;color:#9ca3af;min-width:24px;flex-shrink:0;line-height:1.6}
.ind-content{flex:1;font-size:15px;color:#1a2e1a;line-height:1.5}
.rating{display:flex;gap:6px;padding-left:34px;align-items:center;flex-wrap:wrap}
.r-btn{min-width:52px;height:48px;border:2px solid #d4d4d8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:#9ca3af;font-size:20px;font-weight:800;line-height:1;transition:all .15s;-webkit-tap-highlight-color:transparent}
.r-btn:hover{transform:scale(1.08)}
.r-btn:active{transform:scale(.95)}
.r-btn.sel{color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.r-btn .r-lbl{font-size:8.5px;font-weight:600;margin-top:2px;letter-spacing:.2px}

.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:var(--fs-xs);font-weight:700}

/* ══════ PHOTO ══════ */
.photo-bar{padding:12px var(--pad);border-top:2px dashed #e5d9c5;background:#fef9f3;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.photo-btn{padding:10px 18px;border:2px dashed var(--gold);border-radius:12px;background:#fff;color:#a16207;font-size:14px;font-weight:700;cursor:pointer;min-height:44px}
.photo-thumb{width:52px;height:52px;object-fit:cover;border-radius:10px;border:2px solid #fbbf24}
.photo-rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#dc2626;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-weight:700}

/* ══════ BUTTONS ══════ */
.btn{padding:16px;border:none;border-radius:14px;font-size:var(--fs-base);font-weight:700;cursor:pointer;width:100%;transition:all .2s;font-family:inherit;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;box-shadow:0 4px 12px rgba(45,90,39,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(45,90,39,.4)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#a16207);color:#fff;box-shadow:0 4px 12px rgba(201,168,76,.3)}
.btn-outline{background:#fff;border:2px solid var(--g2);color:var(--g2)}
.btn-danger{background:#fff;border:2px solid #dc2626;color:#dc2626}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:var(--gap);margin-bottom:var(--gap)}

/* ══════ FLOATING BUTTON ══════ */
.fab{position:fixed;bottom:20px;right:16px;background:linear-gradient(135deg,var(--gold),#a16207);color:#fff;border:none;border-radius:18px;padding:14px 24px;font-size:var(--fs-base);font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(201,168,76,.5);z-index:50;display:flex;align-items:center;gap:8px;font-family:inherit;min-height:52px}

/* ══════ TOAST ══════ */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--g1);color:#fff;padding:12px 24px;border-radius:14px;font-size:14px;font-weight:700;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:opacity .3s;white-space:nowrap}
.toast.hide{opacity:0;pointer-events:none}

/* ══════ SUMMARY ══════ */
.score-hero{text-align:center;padding:30px 16px;border-radius:var(--radius);position:relative;overflow:hidden}
.score-hero .emoji{font-size:60px;line-height:1}
.score-hero .total{font-size:56px;font-weight:900;line-height:1;margin-top:6px}
.score-hero .quality{font-size:22px;font-weight:800;margin-top:8px}

.radar-container{padding:20px;display:flex;justify-content:center;align-items:center;background:#fafff5}

/* ══════ EXPORT / PRINT ══════ */
.export-doc{background:#fff;border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.06);overflow:hidden;margin-bottom:var(--gap)}

#print-overlay{position:fixed;inset:0;background:#fff;z-index:9999;overflow-y:auto;padding:12px;font-family:'Sarabun','Noto Sans Thai',sans-serif;-webkit-overflow-scrolling:touch}
.print-controls{position:sticky;top:0;background:#fff;padding:8px 0 12px;display:flex;gap:10px;z-index:10;border-bottom:2px solid #e0e8e0;margin-bottom:12px}
.print-hint{background:#fef9f3;border:2px solid var(--gold);border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px;color:#4a3e26;line-height:1.7}
.print-content{padding-bottom:40px}
.print-content img{max-width:120px !important;height:90px !important;object-fit:cover;border-radius:6px}

@media print {
  body > *:not(#print-overlay) { display:none !important }
  #print-overlay { position:static !important; padding:0 !important; overflow:visible !important }
  .print-controls, .print-hint { display:none !important }
  .print-content { padding:0 !important }
  body { background:#fff !important; padding:0 !important; margin:0 !important; font-size:12px !important; overflow:visible !important }
  .export-doc { box-shadow:none !important; border-radius:0 !important; margin:0 !important; border:none !important }
  .export-doc * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important }
  @page { size:A4; margin:10mm }
}

.spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.status-bar{padding:10px var(--pad);background:#fff3cd;color:#856404;font-size:var(--fs-sm);text-align:center;display:none}
.status-bar.connected{background:#d4edda;color:#155724}
.status-bar.error{background:#f8d7da;color:#721c24}

/* ══════ RESPONSIVE ══════ */
@media (min-width:768px) {
  :root{--fs-base:18px;--fs-sm:15px;--fs-xs:13px;--fs-lg:20px;--fs-xl:26px;--pad:20px;--gap:16px}
  .header{padding:18px 24px}
  .header svg{width:54px;height:54px}
  .nav button{padding:14px 12px;font-size:16px}
  .r-btn{min-width:62px;height:54px;font-size:24px}
  .r-btn .r-lbl{font-size:10px}
  .btn{padding:18px;font-size:18px;min-height:56px}
  .fab{padding:16px 28px;font-size:18px;bottom:24px;right:24px}
  .photo-thumb{width:64px;height:64px}
  .sitmap-letter .big{font-size:42px}
  .sitmap-letter .name{font-size:12px}
  .sitmap-letter .score{font-size:18px}
  .dom-letter-big{font-size:56px;width:70px}
  .dom-name{font-size:19px}
  .dom-score-big .num{font-size:36px}
  .ind-content{font-size:17px}
  .ind-num{font-size:16px;min-width:30px}
  input.f-inp,select.f-inp,textarea.f-inp{padding:14px 16px;font-size:18px;min-height:54px}
}

@media (min-width:1024px) {
  :root{--fs-base:19px;--fs-sm:16px;--fs-xs:14px;--fs-lg:22px;--fs-xl:30px}
  .body{max-width:980px}
  .header-inner,.nav{max-width:980px}
  .sitmap-letter .big{font-size:48px}
  .dom-letter-big{font-size:64px;width:78px}
}

@media (max-width:380px) {
  :root{--fs-base:15px;--fs-sm:13px;--pad:12px;--gap:10px}
  .header h1{font-size:18px}
  .grid2{grid-template-columns:1fr}
  .r-btn{min-width:46px;height:42px;font-size:18px}
  .rating{gap:5px;padding-left:24px}
  .sitmap-letter .big{font-size:28px}
  .sitmap-letter .name{font-size:9px}
}
</style>
</head>

<!-- ══════ HEADER ══════ -->
<div class="header">
  <div class="header-inner">
    <svg width="46" height="46" viewBox="0 0 120 120"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2d5a27"/><stop offset="100%" stop-color="#1a3a18"/></linearGradient></defs><path d="M60 8 L108 28 Q112 30 112 34 L112 60 Q112 90 60 114 Q8 90 8 60 L8 34 Q8 30 12 28 Z" fill="url(#sg)" stroke="#c9a84c" stroke-width="4"/><text x="60" y="68" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="white" letter-spacing="3">CVN</text><path d="M42 30 L60 22 L78 30" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/><path d="M40 82 Q50 78 60 82 Q70 78 80 82" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/></svg>
    <div style="flex:1"><h1 id="h-title">โรงเรียนจารุวัฒนานุกูล</h1><p id="h-sub">📋 SITMAP — แบบนิเทศประถมศึกษา</p></div>
    <button class="lang-btn" onclick="toggleLang()" id="lang-btn">🇬🇧 EN</button>

  </div>
  <div class="nav" id="nav">
    <button class="active" onclick="switchView('form')">📝 ฟอร์ม</button>

</div>
<div id="status-bar" class="status-bar"></div>

<div class="body" id="app"></div>

<button class="fab" id="fab" style="display:none" onclick="switchView('summary')"></button>
<div class="toast hide" id="toast"></div>
<input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIGURATION
// ══════════════════════════════════════════════════════════════
const SCRIPT_URL = "";  // ← วาง URL ของ Apps Script (สำหรับ SITMAP ใหม่)

// ══════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════
//  CALCULATIONS
// ══════════════════════════════════════════════════════════════
function calcDom(dId, sc){
  const d = EVAL.find(x => x.id === dId);
  const ids = d.inds.map(i => i.id);
  const raw = ids.reduce((a, id) => a + (sc[id] || 0), 0);
  const mx = ids.length * 5;
  const scored = ids.filter(id => sc[id]).length;
  return {raw, mx, scored, total: ids.length, wt: mx > 0 ? (raw/mx) * d.w : 0, w: d.w};
}
function calcAll(sc){return EVAL.reduce((a, d) => a + calcDom(d.id, sc).wt, 0)}
function scoredCount(){return Object.keys(state.scores).length}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.remove("hide");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.add("hide"), 2500);
}

function render(){
  const app = document.getElementById("app");
  const lockBtn = document.getElementById("lock-btn");
  const navEl = document.getElementById("nav");

  // System Lock Gate
  if(!state.systemUnlocked){
    if(lockBtn) lockBtn.style.display = "none";
    if(navEl) navEl.style.display = "none";
    app.innerHTML = renderSystemLock();
    bindEvents();
    return;
  }
  if(lockBtn) lockBtn.style.display = "";
  if(navEl) navEl.style.display = "";

  if(state.view === "form") app.innerHTML = renderForm();
  else if(state.view === "summary") app.innerHTML = renderSummary();
  else if(state.view === "export") app.innerHTML = renderExport();
  else if(state.view === "history") app.innerHTML = renderHistory();
  updateNav(); updateFab(); bindEvents();
}

function updateNav(){
  const btns = document.querySelectorAll(".nav button");
  const views = ["form", "summary", "history"];
  const labels = [L("navForm"), L("navSummary"), L("navHistory")+"("+state.records.length+")"];
  btns.forEach((b, i) => {
    b.classList.toggle("active", state.view === views[i] || (state.view === "export" && i === 1));

  });

function updateFab(){
  const fab = document.getElementById("fab");

    fab.style.display = "flex";
    fab.innerHTML = `${q.e} ${tw.toFixed(1)}/100 → ${L("navSummary").replace("📊 ","")}`;
  } else {
    fab.style.display = "none";
  }
}

// ══════════════════════════════════════════════════════════════
//  RADAR CHART (SVG)
// ══════════════════════════════════════════════════════════════
function renderRadar(){
  const cx = 150, cy = 150, R = 110;
  const labels = EVAL.map(d => d.letter);
  const colors = EVAL.map(d => `var(--${d.color})`);
  const n = labels.length;

  // Calculate points
  const values = EVAL.map(d => {
    const dc = calcDom(d.id, state.scores);
    return dc.w > 0 ? (dc.wt/dc.w) : 0; // 0-1
  });

  const angle = i => (Math.PI*2*i)/n - Math.PI/2;
  const pt = (i, r) => `${cx + Math.cos(angle(i))*r},${cy + Math.sin(angle(i))*r}`;

  // Grid (5 levels)
  let grid = "";
  [.2,.4,.6,.8,1].forEach(level => {
    const points = Array.from({length:n}, (_,i) => pt(i, R*level)).join(" ");
    grid += `<polygon points="${points}" fill="none" stroke="#e5d9c5" stroke-width="1"/>`;
  });

  // Axes
  let axes = "";
  for(let i = 0; i < n; i++){
    axes += `<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(angle(i))*R}" y2="${cy+Math.sin(angle(i))*R}" stroke="#e5d9c5" stroke-width="1"/>`;
  }

  // Data polygon
  const dataPoints = Array.from({length:n}, (_,i) => pt(i, R*values[i])).join(" ");
  const dataPolygon = `<polygon points="${dataPoints}" fill="rgba(201,168,76,.3)" stroke="#c9a84c" stroke-width="2.5"/>`;

  // Data dots
  let dots = "";
  for(let i = 0; i < n; i++){
    const [x, y] = pt(i, R*values[i]).split(",");
    dots += `<circle cx="${x}" cy="${y}" r="5" fill="${colors[i]}" stroke="#fff" stroke-width="2"/>`;
  }

  // Labels (outside)
  let labelsHtml = "";
  for(let i = 0; i < n; i++){
    const [x, y] = pt(i, R+22).split(",");
    labelsHtml += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="900" fill="${colors[i]}">${labels[i]}</text>`;
  }

  return `<svg viewBox="0 0 300 300" width="100%" style="max-width:320px;height:auto">
    ${grid}${axes}${dataPolygon}${dots}${labelsHtml}
  </svg>`;
}

function recScores(r){
  if(r.scores && typeof r.scores==="object") return r.scores;
  const out = {};
  Object.keys(r).forEach(k => {
    if(k.startsWith("score_")){
      const id = k.replace("score_","");
      const v = parseInt(r[k]);
      if(!isNaN(v) && v>=1 && v<=5) out[id] = v;
    }
  });
  return out;
}
function recFb(r){
  if(r.fb && typeof r.fb==="object") return r.fb;
  return {point: r.feedback_point||"", comment: r.feedback_comment||""};
}

  }

  // List view
  let h = `<div class="card" style="padding:16px;text-align:center"><div style="font-size:20px;font-weight:800;color:var(--g1)">${L("history")}</div><div style="font-size:13px;color:#6b7280">${state.records.length} ${L("historyN")}</div></div>`;
  if(state.records.length === 0){
    h += `<div class="card" style="padding:40px 20px;text-align:center"><div style="font-size:48px;margin-bottom:8px">📝</div><div style="font-size:14px;color:#6b7280">${L("noHistory")}</div></div>`;
  } else {
    state.records.forEach((r, idx) => {
      const tw = parseFloat(r.total_weighted) || 0;
      const rq = getQ(tw);
      h += `<div class="card" style="cursor:pointer" onclick="viewRecord(${idx})"><div style="padding:14px 16px;display:flex;align-items:center;gap:12px"><div style="width:50px;height:50px;border-radius:12px;background:${rq.bg};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px">${rq.e}</div><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:700;color:var(--g1)">${esc(r.teacher||"-")}</div><div style="font-size:11px;color:#6b7280">${dispClass(r.classLevel)} | ${L("visitLabel")} ${r.visitNum||"-"}</div><div style="font-size:10px;color:#9ca3af">${r.timestamp?new Date(r.timestamp).toLocaleDateString(state.lang==="en"?"en-US":"th-TH",{day:"numeric",month:"short",year:"numeric"}):""}</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:20px;font-weight:900;color:${rq.c}">${tw.toFixed(0)}</div><span class="badge" style="background:${rq.bg};color:${rq.c}">${QL(rq)}</span></div></div></div>`;
    });
    h += `<button class="btn btn-danger" style="margin-top:8px;margin-bottom:8px" onclick="clearAllRecords()">${L("clearAll")}</button>`;
  }
  if(SCRIPT_URL) h += `<button class="btn btn-outline" style="margin-bottom:8px" onclick="loadRecords()">${L("reload")}</button>`;
  h += `<button class="btn btn-outline" style="margin-bottom:16px;border-color:#6b7280;color:#6b7280" onclick="lockHistory()">🔒 ${state.lang==="en"?"Lock History":"ล็อกประวัติ"}</button>`;
  return h;
}

// ══════════════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════════════
function setScore(id, val){
  const v = parseInt(val);
  if(isNaN(v) || v<1 || v>5) return;
  state.scores[id] = v;
  render();
}
function toggleDom(id){state.expDom[id] = !state.expDom[id]; render()}
function uploadPhoto(did){state.uploadTarget = did; document.getElementById("file-input").click()}
function removePhoto(did, idx){state.photos[did].splice(idx, 1); render()}

function updateDate(){
  const d = document.getElementById("date-d")?.value || "";
  const m = document.getElementById("date-m")?.value || "";
  const y = document.getElementById("date-y")?.value || "";
  if(d && m && y) state.info.date = `${y}-${m}-${d}`;
  else state.info.date = "";
  updateFab();
}

document.getElementById("file-input").addEventListener("change", function(e){
  const f = e.target.files?.[0]; if(!f || !state.uploadTarget) return;
  const r = new FileReader();
  r.onload = ev => {
    if(!state.photos[state.uploadTarget]) state.photos[state.uploadTarget] = [];
    state.photos[state.uploadTarget].push({name: f.name, data: ev.target.result});
    toast(state.lang==="en"?"Photo uploaded":"อัปโหลดสำเร็จ"); render();
  };
  r.readAsDataURL(f); e.target.value = "";
});

function resetForm(){
  state.scores = {}; state.photos = {}; state.fb = {point:"", comment:""};
  state.info = {teacher:"", classLevel:"", unit:"", date:"", supervisor:"", visitNum:"", semester:"", year:""};
  state.expDom = {"S":true}; state.saved = false;
  switchView("form");
  toast(state.lang==="en"?"Form cleared":"ล้างฟอร์มเรียบร้อย");
}

function viewRecord(idx){
  const r = state.records[idx];
  if(!r){toast(state.lang==="en"?"Record not found":"ไม่พบข้อมูล"); return;}
  state.histDetail = r; render(); window.scrollTo(0, 0);
}

function deleteRecord(id){
  if(!confirm(L("confirmDelete"))) return;
  state.records = state.records.filter(r => r.id !== id);
  localStorage.setItem("cvn-sitmap-local", JSON.stringify(state.records));
  state.histDetail = null; render();
  toast(state.lang==="en"?"Deleted":"ลบเรียบร้อย");
}

function clearAllRecords(){
  if(!confirm(L("confirmClear"))) return;
  state.records = []; localStorage.removeItem("cvn-sitmap-local");
  render(); toast(state.lang==="en"?"Cleared":"ล้างเรียบร้อย");
}

// ══════════════════════════════════════════════════════════════
//  PIN PROTECTION
// ══════════════════════════════════════════════════════════════
function checkSystemPin(){
  const input = document.getElementById("system-pin-input");
  const errBox = document.getElementById("system-pin-error");
  if(!input) return;
  const val = input.value.trim();
  if(val === ACCESS_PIN || val === HISTORY_PIN || val === MASTER_PIN){
    state.systemUnlocked = true;
    sessionStorage.setItem("cvn-sitmap-system-unlocked", "1");
    if(val === HISTORY_PIN || val === MASTER_PIN){
      state.historyUnlocked = true;
      sessionStorage.setItem("cvn-sitmap-history-unlocked", "1");
    }
    render();
    toast(state.lang==="en"?"🔓 Welcome":"🔓 ยินดีต้อนรับ");
  } else {
    if(errBox) errBox.textContent = state.lang==="en"?"❌ Incorrect PIN":"❌ รหัส PIN ไม่ถูกต้อง";
    input.value = ""; input.focus();
  }
}

function checkPin(){
  const input = document.getElementById("pin-input");
  const errBox = document.getElementById("pin-error");
  if(!input) return;
  const val = input.value.trim();
  if(val === HISTORY_PIN || val === MASTER_PIN){
    state.historyUnlocked = true;
    sessionStorage.setItem("cvn-sitmap-history-unlocked", "1");
    if(SCRIPT_URL && state.records.length === 0) loadRecords();
    render();
    toast(state.lang==="en"?"🔓 Unlocked":"🔓 ปลดล็อกสำเร็จ");
  } else {
    if(errBox) errBox.textContent = state.lang==="en"?"❌ Incorrect PIN":"❌ รหัส PIN ไม่ถูกต้อง";
    input.value = ""; input.focus();
  }
}

function lockHistory(){
  state.historyUnlocked = false;
  state.histDetail = null;
  sessionStorage.removeItem("cvn-sitmap-history-unlocked");
  switchView("form");
  toast(state.lang==="en"?"🔒 History locked":"🔒 ล็อกประวัติแล้ว");
}

function lockSystem(){
  state.systemUnlocked = false;
  state.historyUnlocked = false;
  state.histDetail = null;
  sessionStorage.removeItem("cvn-sitmap-system-unlocked");
  sessionStorage.removeItem("cvn-sitmap-history-unlocked");
  render();
  toast(state.lang==="en"?"🔒 System locked":"🔒 ล็อกระบบแล้ว");
}

// ══════════════════════════════════════════════════════════════
//  COPY / PRINT
// ══════════════════════════════════════════════════════════════
function doCopy(){
  const sc = state.scores; const inf = state.info; const fb = state.fb;
  const tw = calcAll(sc); const q = getQ(tw);
  let t = `═══ ${L("exportTitle")} ═══\n${L("schoolName")} | SITMAP\n\n`;
  t += `👤 ${L("name")}: ${inf.teacher||"-"}\n🎓 ${L("classLabel")}: ${dispClass(inf.classLevel)}\n📚 ${L("unitLabel")}: ${inf.unit||"-"}\n📅 ${L("dateLabel")}: ${inf.date||"-"}\n👨‍🏫 ${L("supervisorLabel")}: ${inf.supervisor||"-"} | ${L("visitLabel")}: ${inf.visitNum||"-"}\n📆 ${L("semesterLabel")} ${inf.semester||"-"}/${inf.year||"-"}\n\n`;
  t += `══ ${L("score100")}: ${tw.toFixed(1)}/100 (${QL(q)}) ══\n\n`;
  EVAL.forEach(d => {
    const dc = calcDom(d.id, sc);
    t += `[${d.letter}] ${TD(d)}: ${dc.wt.toFixed(1)}/${d.w}\n`;
    d.inds.forEach(i => t += `  ${i.id}: ${TI(i)} → ${sc[i.id]||"-"}/5\n`);
    t += `\n`;
  });
  if(fb.point) t += `🎯 ${L("point")}:\n${fb.point}\n\n`;
  if(fb.comment) t += `💡 ${L("comment")}:\n${fb.comment}\n`;

  const ta = document.createElement("textarea");
  ta.value = t; ta.style.cssText = "position:fixed;left:-9999px";
  document.body.appendChild(ta); ta.select();
  try {document.execCommand("copy"); toast(state.lang==="en"?"Copied!":"คัดลอกสำเร็จ!");}
  catch(e) {prompt("Copy:", t);}
  document.body.removeChild(ta);
}

function doPrint(){
  const el = document.getElementById("print-area");
  if(!el){toast("Summary not found"); return;}

  let overlay = document.getElementById("print-overlay");
  if(overlay) overlay.remove();

  overlay = document.createElement("div");
  overlay.id = "print-overlay";
  overlay.innerHTML = `
    <div class="print-controls">
      <button onclick="closePrintOverlay()" style="flex:1;padding:14px;background:#f3f4f6;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">✕ ${state.lang==="en"?"Close":"ปิด"}</button>
      <button onclick="window.print()" style="flex:2;padding:14px;background:#c9a84c;color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">🖨️ Print / Save PDF</button>
    </div>
    <div class="print-hint">
      <b>💡 ${state.lang==="en"?"How to Save as PDF":"วิธีบันทึกเป็น PDF"}:</b><br>
      <b>${state.lang==="en"?"Desktop":"คอม"}:</b> ${state.lang==="en"?"Click Print → Save as PDF":"กด Print → เลือก 'Save as PDF'"}<br>
      <b>iPhone:</b> ${state.lang==="en"?"Share (□↑) → Print → Share → Save to Files":"กด Share (□↑) → Print → Share → Save to Files"}<br>
      <b>Android:</b> ${state.lang==="en"?"Menu (⋮) → Share → Print → Save as PDF":"เมนู (⋮) → Share → Print → Save as PDF"}
    </div>
    <div class="print-content">${el.outerHTML}</div>
  `;
  document.body.appendChild(overlay);
  document.body.style.overflow = "hidden";
  window.scrollTo(0, 0);
}
function closePrintOverlay(){
  const o = document.getElementById("print-overlay");
  if(o) o.remove();
  document.body.style.overflow = "";
}

// ══════════════════════════════════════════════════════════════
//  SAVE / LOAD
// ══════════════════════════════════════════════════════════════
function checkDuplicate(){
  const now = new Date();
  const teacher = (state.info.teacher||"").trim().toLowerCase();
  const date = state.info.date || "";
  const visitNum = state.info.visitNum || "";
  if(!teacher) return null;

  return state.records.find(r => {
    const rTeacher = (r.teacher||"").trim().toLowerCase();
    if(rTeacher !== teacher) return false;
    if(date && r.date === date && visitNum && String(r.visitNum) === String(visitNum)) return true;
    if(r.timestamp){
      const ts = new Date(r.timestamp);
      const hoursDiff = (now - ts) / (1000*60*60);
      if(hoursDiff < DUPLICATE_CHECK_HOURS && date === r.date) return true;
    }
    return false;
  });
}

async function saveToSheet(){
  if(!state.info.teacher || !state.info.supervisor){
    toast(state.lang==="en"?"Please fill teacher and supervisor":"กรุณากรอกชื่อครูและผู้นิเทศ"); return;
  }
  if(scoredCount() < 10){
    toast(state.lang==="en"?"Score at least 10 items":"กรุณาประเมินอย่างน้อย 10 ข้อ"); return;
  }

  const dup = checkDuplicate();
  if(dup){
    const dupDate = dup.timestamp ? new Date(dup.timestamp).toLocaleString(state.lang==="en"?"en-US":"th-TH",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
    const msg = state.lang==="en"
      ? `⚠️ Possible duplicate!\n\n${dup.teacher} | Visit ${dup.visitNum||"-"}\nSaved: ${dupDate}\n\nSave new record anyway?`
      : `⚠️ พบรายการนิเทศที่อาจซ้ำ!\n\n${dup.teacher} | ครั้งที่ ${dup.visitNum||"-"}\nบันทึกเมื่อ: ${dupDate}\n\nต้องการบันทึกใหม่หรือไม่?`;
    if(!confirm(msg)){toast(state.lang==="en"?"Cancelled":"ยกเลิก"); return;}
  }

  if(!SCRIPT_URL){
    toast(state.lang==="en"?"Saved locally":"บันทึก Local แทน");
    saveLocal(); return;
  }

  state.saving = true; render();
  const tw = calcAll(state.scores); const q = getQ(tw);
  const body = {info: state.info, scores: state.scores, feedback: state.fb, photos: [], totalWeighted: tw.toFixed(1), quality: QL(q), framework: "SITMAP"};
  const jsonStr = JSON.stringify(body);

  let success = false;
  try {
    await fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: jsonStr});
    await new Promise(r => setTimeout(r, 2000));
    try {
      const check = await fetch(SCRIPT_URL+"?action=list");
      const checkData = await check.json();
      if(checkData.success){success = true; state.records = checkData.records;}
    } catch(e){}
  } catch(e){}

  if(!success){
    try {
      await new Promise(resolve => {
        const iframe = document.createElement("iframe");
        iframe.name = "cvn_save_"+Date.now();
        iframe.style.cssText = "position:fixed;left:-9999px;width:1px;height:1px";
        document.body.appendChild(iframe);
        const form = document.createElement("form");
        form.method = "POST"; form.action = SCRIPT_URL; form.target = iframe.name;
        const input = document.createElement("input");
        input.type = "hidden"; input.name = "payload"; input.value = jsonStr;
        form.appendChild(input); document.body.appendChild(form);
        iframe.onload = () => {setTimeout(() => {try{document.body.removeChild(iframe)}catch(e){}try{document.body.removeChild(form)}catch(e){}resolve();}, 1000);};
        form.submit();
        setTimeout(resolve, 5000);
      });
      success = true;
    } catch(e){}
  }

  if(success){
    toast("✅ "+(state.lang==="en"?"Saved!":"บันทึกสำเร็จ!"));
    state.saved = true; saveLocal(); loadRecords();
  } else {
    toast(state.lang==="en"?"Saved locally":"บันทึก Local แทน"); saveLocal();
  }
  state.saving = false; render();
}

function saveLocal(){
  const tw = calcAll(state.scores); const q = getQ(tw);
  const rec = {
    id: Date.now(), timestamp: new Date().toISOString(),
    teacher: state.info.teacher, classLevel: state.info.classLevel,
    unit: state.info.unit, date: state.info.date,
    supervisor: state.info.supervisor, visitNum: state.info.visitNum,
    semester: state.info.semester, year: state.info.year,
    total_weighted: tw.toFixed(1), quality: q.l,
    scores: {...state.scores}, fb: {...state.fb}
  };
  let local = JSON.parse(localStorage.getItem("cvn-sitmap-local") || "[]");
  local.unshift(rec);
  localStorage.setItem("cvn-sitmap-local", JSON.stringify(local.slice(0, 200)));
  state.records = local; state.saved = true;
  toast("💾 "+(state.lang==="en"?"Saved":"บันทึกสำเร็จ"));
  render();
}

async function loadRecords(){
  if(!SCRIPT_URL){
    const local = JSON.parse(localStorage.getItem("cvn-sitmap-local") || "[]");
    state.records = local; render(); return;
  }
  try {
    const res = await fetch(SCRIPT_URL+"?action=list");
    const data = await res.json();
    if(data.success){
      state.records = data.records; render();
      toast(state.lang==="en"?`Loaded ${data.records.length} records`:`โหลด ${data.records.length} รายการ`);
    }
  } catch(e){toast(state.lang==="en"?"Load failed":"โหลดไม่สำเร็จ")}
}

// ══════════════════════════════════════════════════════════════
//  BIND EVENTS
// ══════════════════════════════════════════════════════════════
function bindEvents(){
  document.querySelectorAll("[data-info]").forEach(el => {
    el.addEventListener("input", e => {state.info[e.target.dataset.info] = e.target.value});
    el.addEventListener("change", e => {state.info[e.target.dataset.info] = e.target.value});
  });
  document.querySelectorAll("[data-fb]").forEach(el => {
    el.addEventListener("input", e => {state.fb[e.target.dataset.fb] = e.target.value});
  });
  const pinInput = document.getElementById("pin-input");
  if(pinInput){pinInput.addEventListener("keydown", e => {if(e.key==="Enter") checkPin();}); pinInput.focus();}
  const sysPinInput = document.getElementById("system-pin-input");
  if(sysPinInput){sysPinInput.addEventListener("keydown", e => {if(e.key==="Enter") checkSystemPin();}); sysPinInput.focus();}
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
function init(){
  if(sessionStorage.getItem("cvn-sitmap-system-unlocked") === "1") state.systemUnlocked = true;
  if(sessionStorage.getItem("cvn-sitmap-history-unlocked") === "1") state.historyUnlocked = true;
  loadRecords();
  render();
  if(SCRIPT_URL){
    const bar = document.getElementById("status-bar");
    bar.style.display = "block"; bar.textContent = "🔄 Connecting..."; bar.className = "status-bar";
    loadRecords().then(() => {
      bar.textContent = "✅ Connected"; bar.className = "status-bar connected";
      setTimeout(() => bar.style.display = "none", 3000);
    }).catch(() => {bar.textContent = "❌ Connection failed"; bar.className = "status-bar error"});
  }
}
init();
</script>
